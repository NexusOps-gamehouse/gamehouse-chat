/*
 * gamehouse-chat — 채팅방 · 메시지 · WebSocket(STOMP) 서비스.
 *
 * 모노레포에서는 backend 루트 build.gradle 이 plugin·toolchain·컴파일 옵션을
 * subprojects 로 일괄 적용하고, common 은 project(':common') 으로 참조했다.
 * 레포가 갈라지면서 둘 다 사라졌으므로 여기서 직접 선언한다.
 */
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'gg.duo'
version = '0.0.1-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories {
    mavenCentral()

    /*
     * common 이 사는 곳.
     *
     * ⚠️ GitHub Packages 는 public 패키지도 읽기에 토큰이 필요하다.
     *    팀원 전원이 ~/.gradle/gradle.properties 에 아래 두 줄을 넣어야 빌드된다.
     *      gpr.user=<GitHub 아이디>
     *      gpr.key=<classic PAT · read:packages>
     *
     *    CI 는 조직 secret GPR_TOKEN 을 쓰고, 없으면 GITHUB_TOKEN 으로 넘어간다.
     */
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/NexusOps-gamehouse/gamehouse-common'
        credentials {
            username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = findProperty('gpr.key')  ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
    options.encoding = 'UTF-8'
}

dependencies {
    /*
     * 모노레포의 project(':common') 이 여기로 바뀐다.
     * common 이 Spring Boot BOM 을 api 로 노출하므로 starter 에 버전을 적지 않는다.
     *
     * ⚠️ 고정 버전이다. common 이 올라가면 여기 버전도 함께 올린다.
     */
    implementation 'gg.duo:common:0.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    /*
     * STOMP 브로커 릴레이에 필요하다.
     *
     * WebSocketConfig 가 enableStompBrokerRelay 로 메시지 전달을 RabbitMQ 에
     * 위임하는데, Spring 은 그 TCP 연결을 만들 때 reactor.netty.tcp.TcpClient 를
     * 찾는다. 없으면 부팅이 이렇게 죽는다.
     *   IllegalStateException: No compatible version of Reactor Netty
     *
     * 모놀리식일 때는 riot 이 쓰던 spring-boot-starter-webflux 가 이걸 딸려와서
     * 우연히 채워주고 있었다.
     *
     * ⚠️ reactor-netty-core 만으로는 부족하다. Spring 의 감지 코드가 보는 클래스가
     *    reactor.netty.http.client.HttpClient 이고, 그건 reactor-netty-http 에 있다.
     *    core 는 http 가 전이 의존으로 끌어온다.
     *
     * webflux 를 통째로 넣지 않는 이유: chat 은 WebClient 를 쓰지 않는다.
     * (버전은 common 이 노출하는 Spring Boot BOM 이 관리한다)
     */
    implementation 'io.projectreactor.netty:reactor-netty-http'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }
